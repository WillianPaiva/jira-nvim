name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      # Setup Lua
      - name: Setup Lua
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1.5"
      
      # Setup LuaRocks
      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@v4
      
      # Install busted testing framework
      - name: Install busted
        run: |
          luarocks install busted
          luarocks install luacov
      
      # Install Neovim
      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      
      # Setup test environment
      - name: Setup test environment
        run: |
          # Create directories for mocks
          mkdir -p spec/mocks/plenary
          
          # Make script executable
          chmod +x $GITHUB_WORKSPACE/scripts/ci-test-runner.lua
      
      # Run tests with busted (first attempt)
      - name: Run tests with busted
        run: |
          cd $GITHUB_WORKSPACE
          busted -o utfTerminal spec/ || echo "Busted test runner failed, will try custom runner"
      
      # Run tests with our custom CI test runner (more robust)
      - name: Run tests with custom CI runner
        run: |
          cd $GITHUB_WORKSPACE
          lua scripts/ci-test-runner.lua